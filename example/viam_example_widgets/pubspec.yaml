name: viam_example_widgets
description: Example widgets for controlling Viam resources, shared by the example apps.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  viam_sdk:
    path: ../../
  flutter_joystick: ^0.2.1
  grpc: ^4.0.1
  flutter_platform_widgets: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
