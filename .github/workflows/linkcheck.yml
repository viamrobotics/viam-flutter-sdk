# .github/workflows/run-htmltest.yml
# (c) 2021 Robb Romans
#
# Run htmltest link checker on generated HTML output in dist/
# https://github.com/wjdp/htmltest
#
name: run-htmltest-external
concurrency:
  group: pullrequest-untrusted-htmltest-${{ github.event.number }}
  cancel-in-progress: true
on: pull_request
jobs:
  htmltest:
    runs-on: ubuntu-large
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2

      - name: Setup Flutter
        run: flutter pub get

      # The dartdoc bundled with Flutter 3.47 (9.0.6) crashes while precaching docs:
      # it slices `@docImport` source ranges from dependencies' comments against the
      # wrong string. Flutter itself carries those directives, so any package hits it.
      # Fixed upstream after 9.0.6, so run a current dartdoc instead of `dart doc`.
      - name: Generate docs
        run: |
          dart pub global activate dartdoc 9.0.11
          dart pub global run dartdoc

      - name: Test HTML
        # https://github.com/wjdp/htmltest-action/
        # Don't fail the build on broken links
        continue-on-error: true
        uses: wjdp/htmltest-action@master
        with:
          config: .htmltest.yml
      - name: Archive htmltest results
        uses: actions/upload-artifact@v4
        # Note: Set ACTIONS_RUNTIME_TOKEN env variable to test with nektos/act
        with:
          name: htmltest-report
          path: tmp/.htmltest/htmltest.log
          retention-days: 7 # Default is 90 days
