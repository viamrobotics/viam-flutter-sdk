name: Generate docs

on:
  workflow_dispatch:
  push:
    paths:
      - "lib/**"
      - "doc/**"
      - "README.md"
      - "dartdoc_options.yaml"
    branches: [main]

jobs:
  generate-docs:
    if: github.repository_owner == 'viamrobotics'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2

      - name: Setup Flutter
        run: flutter pub get

      # The dartdoc bundled with Flutter 3.47 (9.0.6) crashes while precaching docs:
      # it slices `@docImport` source ranges from dependencies' comments against the
      # wrong string. Flutter itself carries those directives, so any package hits it.
      # Fixed upstream after 9.0.6, so run a current dartdoc instead of `dart doc`.
      - name: Generate docs
        run: |
          dart pub global activate dartdoc 9.0.11
          dart pub global run dartdoc

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: doc/api
          publish_branch: docs-gh_pages
          cname: flutter.viam.dev

      - name: Zip artifacts
        run: zip html-docs.zip ./doc/api -r

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: html-docs.zip
